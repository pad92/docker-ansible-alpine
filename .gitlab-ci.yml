image: docker:git

services:
- docker:dind

default:
  tags:
    - chataigne

variables:
  MANUAL_ANSIBLE_VERSION:
    value: "13.7.0"
    description: "Version Ansible du build manuel."
  MANUAL_ANSIBLE_CORE_VERSION:
    value: ""
    description: "Override ansible-core ; vide pour la résolution automatique."
  MANUAL_IMAGE_TAG:
    value: ""
    description: "Tag Docker ; vide pour ansible-<version>-<commit>."

stages:
- automation
- build
- test
- release

before_script:
  - printf '%s' "${CI_JOB_TOKEN}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  - |
    if [ -n "${DOCKER_HUB_PASSWORD}" ] && [ -n "${DOCKER_HUB_USER}" ]; then
      echo "${DOCKER_HUB_PASSWORD}" | docker login -u "${DOCKER_HUB_USER}" --password-stdin
    fi

check_ansible_release:
  stage: automation
  resource_group: ansible-release-check
  image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  before_script:
    - apk add --no-cache coreutils curl jq
  script:
    - ./ci/check-ansible-release.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

build_image:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - |
      . ./versions.env
      export ALPINE_IMAGE ANSIBLE_VERSION ANSIBLE_CORE_VERSION ANSIBLE_LINT_VERSION MITOGEN_VERSION
      ./ci/build-image.sh "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"

build_manual_ansible:
  stage: build
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - apk add --no-cache curl jq
    - test -n "${MANUAL_ANSIBLE_VERSION:-}" || (echo "Set MANUAL_ANSIBLE_VERSION before starting this job" >&2; exit 1)
    - . ./versions.env
    - |
      if [ -n "${MANUAL_ANSIBLE_CORE_VERSION:-}" ]; then
        manual_core_version="${MANUAL_ANSIBLE_CORE_VERSION}"
      else
        manual_core_version="$(curl --fail --silent --show-error \
          "https://pypi.org/pypi/ansible/${MANUAL_ANSIBLE_VERSION}/json" \
          | jq --raw-output '(.info.requires_dist // [])[] | select(startswith("ansible-core~=")) | split("~=")[1] | split(",")[0]' \
          | head -n 1)"
      fi
      test -n "${manual_core_version}" || {
        echo "Unable to determine a compatible ansible-core for ${MANUAL_ANSIBLE_VERSION}" >&2
        exit 1
      }
      manual_image_tag="${MANUAL_IMAGE_TAG:-ansible-${MANUAL_ANSIBLE_VERSION}-${CI_COMMIT_SHORT_SHA}}"
      case "${manual_image_tag}" in
        ''|*[!a-zA-Z0-9_.-]*)
          echo "MANUAL_IMAGE_TAG contains unsupported characters" >&2
          exit 1
          ;;
      esac
      printf 'Building %s with ansible-core %s\n' "${MANUAL_ANSIBLE_VERSION}" "${manual_core_version}"
      printf '%s' "${CI_JOB_TOKEN}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      if [ -n "${DOCKER_HUB_PASSWORD:-}" ] && [ -n "${DOCKER_HUB_USER:-}" ]; then
        printf '%s' "${DOCKER_HUB_PASSWORD}" | docker login --username "${DOCKER_HUB_USER}" --password-stdin
      else
        echo "DOCKER_HUB_USER and DOCKER_HUB_PASSWORD must be configured to publish to Docker Hub" >&2
        exit 1
      fi
      docker_hub_image="${DU_REGISTRY_IMAGE:-pad92/ansible-alpine}"
      ANSIBLE_VERSION="${MANUAL_ANSIBLE_VERSION}"
      ANSIBLE_CORE_VERSION="${manual_core_version}"
      export ALPINE_IMAGE ANSIBLE_VERSION ANSIBLE_CORE_VERSION ANSIBLE_LINT_VERSION MITOGEN_VERSION
      ./ci/build-image.sh \
        "${CI_REGISTRY_IMAGE}:${manual_image_tag}" \
        "${docker_hub_image}:${manual_image_tag}"
      echo "Image published: ${CI_REGISTRY_IMAGE}:${manual_image_tag} and ${docker_hub_image}:${manual_image_tag}"

test_ansible:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  before_script: []
  script:
    - sh ci/test-ansible-version-at-least.sh
    - expected="$(sed -n 's/^ANSIBLE_VERSION=//p' versions.env)"
    - actual="$(python3 -c 'import importlib.metadata as m; print(m.version("ansible"))')"
    - test "${actual}" = "${expected}"
    - expected_core="$(sed -n 's/^ANSIBLE_CORE_VERSION=//p' versions.env)"
    - actual_core="$(python3 -c 'import importlib.metadata as m; print(m.version("ansible-core"))')"
    - test "${actual_core}" = "${expected_core}"
    - ansible --version
    - ansible-lint --version

test_mitogen:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  before_script: []
  script:
    - python3 -c "import ansible_mitogen"

test_trivy:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  image:
    name: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]
  before_script: []
  variables:
    TRIVY_USERNAME: "${CI_REGISTRY_USER}"
    TRIVY_PASSWORD: "${CI_JOB_TOKEN}"
    TRIVY_CACHE_DIR: "${CI_PROJECT_DIR}/trivy-cache"
  cache:
    key: trivy-cache
    paths:
      - trivy-cache/
  script:
    - trivy image --cache-dir "${TRIVY_CACHE_DIR}" --secret-config "${CI_PROJECT_DIR}/trivy-secret.yaml" --exit-code 1 --severity CRITICAL --no-progress "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
    - trivy image --cache-dir "${TRIVY_CACHE_DIR}" --secret-config "${CI_PROJECT_DIR}/trivy-secret.yaml" --exit-code 1 --severity HIGH --no-progress "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"

.release_base:
  stage: release
  before_script:
    - printf '%s' "${CI_JOB_TOKEN}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - |
      if [ -n "${DOCKER_HUB_PASSWORD}" ] && [ -n "${DOCKER_HUB_USER}" ]; then
        echo "${DOCKER_HUB_PASSWORD}" | docker login -u "${DOCKER_HUB_USER}" --password-stdin
      fi

release_tag:
  extends: .release_base
  variables:
    RELEASE_TAGS: "${CI_COMMIT_TAG}"
  script:
    - |
      DOCKER_HUB_IMAGE="${DU_REGISTRY_IMAGE:-pad92/ansible-alpine}"
      TAGS=""
      for tag in ${RELEASE_TAGS}; do
        TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:${tag}"
        if [ -n "${DOCKER_HUB_USER}" ] && [ -n "${DOCKER_HUB_PASSWORD}" ]; then
          TAGS="${TAGS} --tag ${DOCKER_HUB_IMAGE}:${tag}"
        fi
      done
      echo "Promoting image ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA} to tags: ${RELEASE_TAGS}"
      docker buildx imagetools create ${TAGS} "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG'

release_master:
  extends: .release_base
  resource_group: ansible-latest-release
  script:
    - |
      . ./versions.env
      DOCKER_HUB_IMAGE="${DU_REGISTRY_IMAGE:-pad92/ansible-alpine}"
      SOURCE_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"

      echo "Promoting ${SOURCE_IMAGE} to Ansible tag ${ANSIBLE_VERSION}"
      docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:${ANSIBLE_VERSION}" "${SOURCE_IMAGE}"
      if [ -n "${DOCKER_HUB_USER}" ] && [ -n "${DOCKER_HUB_PASSWORD}" ]; then
        docker buildx imagetools create --tag "${DOCKER_HUB_IMAGE}:${ANSIBLE_VERSION}" "${SOURCE_IMAGE}"
      fi

      promote_latest_if_not_older() {
        image="$1"
        if latest_manifest="$(docker buildx imagetools inspect "${image}:latest" 2>&1)"; then
          current_version="$(docker run --rm --entrypoint python3 "${image}:latest" \
            -c 'import importlib.metadata as m; print(m.version("ansible"))')"
        elif printf '%s\n' "${latest_manifest}" | grep -Eqi 'manifest unknown|no such manifest'; then
          echo "No ${image}:latest tag exists; promoting ${SOURCE_IMAGE}"
          docker buildx imagetools create --tag "${image}:latest" "${SOURCE_IMAGE}"
          return
        else
          echo "Unable to inspect ${image}:latest: ${latest_manifest}" >&2
          return 1
        fi

        if [ "${ANSIBLE_VERSION}" = "${current_version}" ]; then
          echo "Keeping ${image}:latest at Ansible ${current_version}; the candidate has the same version"
        elif sh ci/is-ansible-version-at-least.sh "${ANSIBLE_VERSION}" "${current_version}"; then
          echo "Promoting ${SOURCE_IMAGE} to ${image}:latest (Ansible ${ANSIBLE_VERSION}; current latest: ${current_version})"
          docker buildx imagetools create --tag "${image}:latest" "${SOURCE_IMAGE}"
        else
          compare_status=$?
          if [ "${compare_status}" -ne 1 ]; then
            echo "Unable to compare Ansible versions for ${image}:latest" >&2
            exit "${compare_status}"
          fi
          echo "Keeping ${image}:latest at Ansible ${current_version}; ${ANSIBLE_VERSION} is not newer"
        fi
      }

      promote_latest_if_not_older "${CI_REGISTRY_IMAGE}"
      if [ -n "${DOCKER_HUB_USER}" ] && [ -n "${DOCKER_HUB_PASSWORD}" ]; then
        promote_latest_if_not_older "${DOCKER_HUB_IMAGE}"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web" && $CI_COMMIT_BRANCH == "master"'

release_feature:
  extends: .release_base
  script:
    - |
      TAG_PREFIX="${CI_COMMIT_REF_NAME%%-*}"
      echo "Promoting image to feature tag: ${TAG_PREFIX}"
      docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:${TAG_PREFIX}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH =~ /^[0-9]+-.*$/'

release_nonstd:
  extends: .release_base
  script:
    - |
      TAG_NAME="${CI_COMMIT_REF_SLUG}"
      echo "Promoting image to branch tag: ${TAG_NAME}"
      docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:${TAG_NAME}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH =~ /^[a-zA-Z]+.*$/ && $CI_COMMIT_BRANCH != "master" && $CI_COMMIT_BRANCH != "dev"'
