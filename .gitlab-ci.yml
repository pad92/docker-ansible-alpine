image: docker:git

services:
- docker:dind

default:
  tags:
    - chataigne

variables:
  MANUAL_ANSIBLE_VERSION:
    value: "13.7.0"
    description: "Version Ansible du build manuel."
  MANUAL_ANSIBLE_CORE_VERSION:
    value: ""
    description: "Override ansible-core ; vide pour la résolution automatique."
  MANUAL_IMAGE_TAG:
    value: ""
    description: "Suffixe du tag manual- ; vide pour <version>-<commit>."

stages:
- automation
- build
- test
- release

before_script:
  - printf '%s' "${CI_JOB_TOKEN}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  - |
    if [ -n "${DOCKER_HUB_PASSWORD}" ] && [ -n "${DOCKER_HUB_USER}" ]; then
      echo "${DOCKER_HUB_PASSWORD}" | docker login -u "${DOCKER_HUB_USER}" --password-stdin
    fi

check_ansible_release:
  stage: automation
  resource_group: ansible-release-check
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  before_script:
    - apk add --no-cache coreutils curl jq
  script:
    - ./ci/check-ansible-release.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

check_alpine_release:
  stage: automation
  services: []
  resource_group: alpine-release-check
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh ci/check-alpine-release.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

validate_ci:
  stage: automation
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  services: []
  before_script:
    - apk add --no-cache make python3 py3-yaml jq shellcheck git
  script:
    - make test-ci
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'

.build_image_function:
  script:
    - |
      build_image() {
        if [ "$#" -lt 1 ] || [ "$#" -gt 2 ]; then
          echo "Usage: build_image <image:tag> [<image:tag>]" >&2
          return 2
        fi
        image_tag_1="$1"
        image_tag_2="${2:-}"

        test -n "${ALPINE_IMAGE:-}"
        test -n "${ANSIBLE_VERSION:-}"
        test -n "${ANSIBLE_CORE_VERSION:-}"
        test -n "${ANSIBLE_LINT_VERSION:-}"
        test -n "${MITOGEN_VERSION:-}"
        grep -q '^ARG ANSIBLE_VERSION$' Dockerfile
        grep -q '^ARG ANSIBLE_CORE_VERSION$' Dockerfile
        grep -q '^ARG ANSIBLE_LINT_VERSION$' Dockerfile
        grep -q '^ARG MITOGEN_VERSION$' Dockerfile

        docker run --privileged multiarch/qemu-user-static --reset -p yes
        docker buildx create --driver docker-container --use

        set -- docker buildx build \
          --metadata-file build-metadata.json \
          --provenance=false \
          --pull \
          --push \
          --build-arg "ALPINE_IMAGE=${ALPINE_IMAGE}" \
          --build-arg "ANSIBLE_VERSION=${ANSIBLE_VERSION}" \
          --build-arg "ANSIBLE_CORE_VERSION=${ANSIBLE_CORE_VERSION}" \
          --build-arg "ANSIBLE_LINT_VERSION=${ANSIBLE_LINT_VERSION}" \
          --build-arg "MITOGEN_VERSION=${MITOGEN_VERSION}" \
          --build-arg "BUILD_NAME=${CI_PROJECT_NAME}" \
          --build-arg "BUILD_DATE=$(date '+%FT%T.%s%z')" \
          --build-arg "BUILD_VCSREF=${CI_COMMIT_SHA}" \
          --build-arg "BUILD_PIPELINE_ID=${CI_PIPELINE_ID}" \
          --platform=linux/amd64,linux/arm64

        set -- "$@" --tag "$image_tag_1"
        if [ -n "${image_tag_2}" ]; then
          set -- "$@" --tag "$image_tag_2"
        fi
        "$@" .
      }

build_image:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - !reference [.build_image_function, script]
    - . ./versions.env
    - export ALPINE_IMAGE ANSIBLE_VERSION ANSIBLE_CORE_VERSION ANSIBLE_LINT_VERSION MITOGEN_VERSION
    - apk add --no-cache jq
    - build_image "${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    - digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' build-metadata.json)
    - printf 'TESTED_IMAGE=%s@%s\n' "$CI_REGISTRY_IMAGE" "$digest" > image.env
  artifacts:
    reports:
      dotenv: image.env
    paths:
      - build-metadata.json

build_manual_ansible:
  stage: build
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - !reference [.build_image_function, script]
    - apk add --no-cache curl jq
    - test -n "${MANUAL_ANSIBLE_VERSION:-}" || (echo "Set MANUAL_ANSIBLE_VERSION before starting this job" >&2; exit 1)
    - . ./versions.env
    - |
      if [ -n "${MANUAL_ANSIBLE_CORE_VERSION:-}" ]; then
        manual_core_version="${MANUAL_ANSIBLE_CORE_VERSION}"
      else
        manual_core_version="$(curl --fail --silent --show-error \
          "https://pypi.org/pypi/ansible/${MANUAL_ANSIBLE_VERSION}/json" \
          | jq --raw-output '(.info.requires_dist // [])[] | select(startswith("ansible-core~=")) | split("~=")[1] | split(",")[0]' \
          | head -n 1)"
      fi
      test -n "${manual_core_version}" || {
        echo "Unable to determine a compatible ansible-core for ${MANUAL_ANSIBLE_VERSION}" >&2
        exit 1
      }
      manual_image_tag="manual-${MANUAL_IMAGE_TAG:-${MANUAL_ANSIBLE_VERSION}-${CI_COMMIT_SHORT_SHA}}"
      case "${manual_image_tag}" in
        ''|*[!a-zA-Z0-9_.-]*)
          echo "MANUAL_IMAGE_TAG contains unsupported characters" >&2
          exit 1
          ;;
      esac
      printf 'Building %s with ansible-core %s\n' "${MANUAL_ANSIBLE_VERSION}" "${manual_core_version}"
      printf '%s' "${CI_JOB_TOKEN}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      if [ -n "${DOCKER_HUB_PASSWORD:-}" ] && [ -n "${DOCKER_HUB_USER:-}" ]; then
        printf '%s' "${DOCKER_HUB_PASSWORD}" | docker login --username "${DOCKER_HUB_USER}" --password-stdin
      else
        echo "DOCKER_HUB_USER and DOCKER_HUB_PASSWORD must be configured to publish to Docker Hub" >&2
        exit 1
      fi
      docker_hub_image="${DU_REGISTRY_IMAGE:-pad92/ansible-alpine}"
      ANSIBLE_VERSION="${MANUAL_ANSIBLE_VERSION}"
      ANSIBLE_CORE_VERSION="${manual_core_version}"
      export ALPINE_IMAGE ANSIBLE_VERSION ANSIBLE_CORE_VERSION ANSIBLE_LINT_VERSION MITOGEN_VERSION
      build_image \
        "${CI_REGISTRY_IMAGE}:${manual_image_tag}" \
        "${docker_hub_image}:${manual_image_tag}"
      echo "Image published: ${CI_REGISTRY_IMAGE}:${manual_image_tag} and ${docker_hub_image}:${manual_image_tag}"

test_ansible:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - sh ci/test-ansible-version-at-least.sh
    - expected="$(sed -n 's/^ANSIBLE_VERSION=//p' versions.env)"
    - actual="$(docker run --rm --entrypoint python3 "$TESTED_IMAGE" -c 'import importlib.metadata as m; print(m.version("ansible"))')"
    - test "${actual}" = "${expected}"
    - expected_core="$(sed -n 's/^ANSIBLE_CORE_VERSION=//p' versions.env)"
    - actual_core="$(docker run --rm --entrypoint python3 "$TESTED_IMAGE" -c 'import importlib.metadata as m; print(m.version("ansible-core"))')"
    - test "${actual_core}" = "${expected_core}"
    - docker run --rm "$TESTED_IMAGE" ansible --version
    - docker run --rm "$TESTED_IMAGE" ansible-lint --version
    - mkdir -p validation
    - printf '%s\n' "$TESTED_IMAGE" > validation/ansible.txt
  artifacts:
    paths: [validation/ansible.txt]

test_mitogen:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  script:
    - docker run --rm --entrypoint python3 "$TESTED_IMAGE" -c "import ansible_mitogen"
    - mkdir -p validation
    - printf '%s\n' "$TESTED_IMAGE" > validation/mitogen.txt
  artifacts:
    paths: [validation/mitogen.txt]

test_trivy:
  stage: test
  services: []
  parallel:
    matrix:
      - SCAN_PLATFORM: [linux/amd64, linux/arm64]
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"'
  image:
    name: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    entrypoint: [""]
  before_script: []
  variables:
    TRIVY_USERNAME: "${CI_REGISTRY_USER}"
    TRIVY_PASSWORD: "${CI_JOB_TOKEN}"
    TRIVY_CACHE_DIR: "${CI_PROJECT_DIR}/trivy-cache"
  cache:
    key: trivy-cache
    paths:
      - trivy-cache/
  script:
    - trivy image --cache-dir "${TRIVY_CACHE_DIR}" --secret-config "${CI_PROJECT_DIR}/trivy-secret.yaml" --exit-code 1 --severity HIGH,CRITICAL --no-progress --platform "$SCAN_PLATFORM" "$TESTED_IMAGE"
    - mkdir -p validation
    - printf '%s\n' "$TESTED_IMAGE" > "validation/trivy-${SCAN_PLATFORM#linux/}.txt"
  artifacts:
    paths: [validation/]

resolve_published:
  stage: automation
  services: []
  script:
    - . ci/registry.sh
    - digest=$(registry_digest "${CI_REGISTRY_IMAGE}:latest")
    - printf 'PUBLISHED_IMAGE=%s@%s\n' "$CI_REGISTRY_IMAGE" "$digest" > published.env
  artifacts:
    reports:
      dotenv: published.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

scan_published:
  extends: test_trivy
  stage: test
  needs: [resolve_published]
  artifacts: null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - trivy image --cache-dir "$TRIVY_CACHE_DIR" --secret-config "$CI_PROJECT_DIR/trivy-secret.yaml" --exit-code 1 --severity HIGH,CRITICAL --no-progress --platform "$SCAN_PLATFORM" "$PUBLISHED_IMAGE"

.release_base:
  stage: release
  before_script:
    - printf '%s' "${CI_JOB_TOKEN}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - |
      if [ -n "${DOCKER_HUB_PASSWORD}" ] && [ -n "${DOCKER_HUB_USER}" ]; then
        echo "${DOCKER_HUB_PASSWORD}" | docker login -u "${DOCKER_HUB_USER}" --password-stdin
      fi

release_tag:
  extends: .release_base
  variables:
    RELEASE_TAGS: "git-${CI_COMMIT_TAG}"
  script:
    - |
      DOCKER_HUB_IMAGE="${DU_REGISTRY_IMAGE:-pad92/ansible-alpine}"
      TAGS=""
      for tag in ${RELEASE_TAGS}; do
        TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:${tag}"
        if [ -n "${DOCKER_HUB_USER}" ] && [ -n "${DOCKER_HUB_PASSWORD}" ]; then
          TAGS="${TAGS} --tag ${DOCKER_HUB_IMAGE}:${tag}"
        fi
      done
      echo "Promoting image ${TESTED_IMAGE} to tags: ${RELEASE_TAGS}"
      docker buildx imagetools create ${TAGS} "${TESTED_IMAGE}"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG'

release_master:
  extends: .release_base
  resource_group: ansible-latest-release
  script:
    - apk add --no-cache make jq
    - make release
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

release_feature:
  extends: .release_base
  script:
    - |
      TAG_PREFIX="branch-${CI_COMMIT_REF_SLUG}"
      echo "Promoting image to feature tag: ${TAG_PREFIX}"
      docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:${TAG_PREFIX}" "${TESTED_IMAGE}"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH =~ /^[0-9]+-.*$/'

release_nonstd:
  extends: .release_base
  script:
    - |
      TAG_NAME="branch-${CI_COMMIT_REF_SLUG}"
      echo "Promoting image to branch tag: ${TAG_NAME}"
      docker buildx imagetools create --tag "${CI_REGISTRY_IMAGE}:${TAG_NAME}" "${TESTED_IMAGE}"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH =~ /^[a-zA-Z]+.*$/ && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "dev"'
