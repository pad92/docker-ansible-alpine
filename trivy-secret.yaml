allow-rules:
  - id: ansible-community-aws-example-access-key
    description: Ignore the all-X placeholder in the bundled community.aws module documentation.
    regex: ASIAX{16}
  - id: ansible-google-cloud-example-key-region-proxy
    description: Ignore a masked private-key example in a bundled Ansible module.
    path: .*/ansible_collections/google/cloud/plugins/modules/gcp_compute_region_target_https_proxy\.py$
  - id: ansible-google-cloud-example-key-certificate
    description: Ignore a masked private-key example in a bundled Ansible module.
    path: .*/ansible_collections/google/cloud/plugins/modules/gcp_compute_ssl_certificate\.py$
  - id: ansible-google-cloud-example-key-target-proxy
    description: Ignore a masked private-key example in a bundled Ansible module.
    path: .*/ansible_collections/google/cloud/plugins/modules/gcp_compute_target_https_proxy\.py$
  - id: ansible-google-cloud-example-key-target-ssl-proxy
    description: Ignore a masked private-key example in a bundled Ansible module.
    path: .*/ansible_collections/google/cloud/plugins/modules/gcp_compute_target_ssl_proxy\.py$
  - id: ansible-netapp-example-key-certificate
    description: Ignore a masked private-key example in a bundled Ansible module.
    path: .*/ansible_collections/netapp/storagegrid/plugins/modules/na_sg_grid_certificate\.py$
